<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle Quizzer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --error: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.8rem;
        }

        .menu-btn, .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: background-color 0.2s;
        }

        .menu-btn:hover, .action-btn:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none !important;
        }

        .quiz-box {
            margin: 20px 0;
        }

        .question {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .binary-options {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .yes-btn { background-color: var(--success); }
        .no-btn { background-color: var(--error); }
        .yes-btn:hover { background-color: #15803d; }
        .no-btn:hover { background-color: #b91c1c; }

        .feedback {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0;
            padding: 10px;
            border-radius: 6px;
        }

        .feedback.correct {
            color: var(--success);
            background-color: #f0fdf4;
        }

        .feedback.incorrect {
            color: var(--error);
            background-color: #fef2f2;
        }

        .back-btn {
            background-color: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
            margin-top: 15px;
        }
        .back-btn:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MENU VIEW -->
    <div id="menu-view">
        <h1>📐 Right Triangle Quizzer</h1>
        <p>Select a mode to test your knowledge:</p>
        <button class="menu-btn" onclick="startQuiz(1)">1. Find the Missing 3rd Side</button>
        <button class="menu-btn" onclick="startQuiz(2)">2. Is it a Right Triangle?</button>
    </div>

    <!-- QUIZ VIEW -->
    <div id="quiz-view" class="hidden">
        <div class="quiz-box">
            <div id="question-text" class="question"></div>
            
            <!-- Input area for Mode 1 -->
            <div id="mode1-input-area" class="hidden">
                <input type="number" id="user-answer" placeholder="Enter your answer" onkeydown="if(event.key==='Enter') checkAnswer1()">
                <button class="action-btn" onclick="checkAnswer1()">Submit Answer</button>
            </div>

            <!-- Input area for Mode 2 -->
            <div id="mode2-input-area" class="hidden" class="binary-options">
                <div class="binary-options">
                    <button class="action-btn yes-btn" onclick="checkAnswer2(true)">Yes (Right Triangle)</button>
                    <button class="action-btn no-btn" onclick="checkAnswer2(false)">No (Not Right Triangle)</button>
                </div>
            </div>

            <div id="feedback-text" class="feedback hidden"></div>
            <button id="next-btn" class="action-btn hidden" onclick="generateQuestion()">Next Question</button>
        </div>
        <button class="action-btn back-btn" onclick="showMenu()">← Back to Menu</button>
    </div>
</div>

<script>
    // All 50 Pythagorean triples from your "Sorted by Hypotenuse" list
    const TRIPLES = [, [6, 8, 10], [5, 12, 13], [9, 12, 15], [8, 15, 17],
, [7, 24, 25], [15, 20, 25], [10, 24, 26], [20, 21, 29],
, [16, 30, 34], [21, 28, 35], [12, 35, 37], [15, 36, 39],
, [9, 40, 41], [27, 36, 45], [14, 48, 50], [30, 40, 50],
, [20, 48, 52], [28, 45, 53], [33, 44, 55], [40, 42, 58],
, [11, 60, 61], [25, 60, 65], [39, 52, 65], [16, 63, 65],
, [32, 60, 68], [42, 56, 70], [48, 55, 73], [24, 70, 74],
, [45, 60, 75], [30, 72, 78], [48, 64, 80], [18, 80, 82],
, [36, 77, 85], [40, 75, 85], [51, 68, 85], [60, 63, 87],
, [54, 72, 90], [35, 84, 91], [57, 76, 95], [65, 72, 97]
    ];

    let currentMode = 0;
    let currentCorrectAnswer;
    let currentTripletState = [];

    function showMenu() {
        document.getElementById('menu-view').classList.remove('hidden');
        document.getElementById('quiz-view').classList.add('hidden');
    }

    function startQuiz(mode) {
        currentMode = mode;
        document.getElementById('menu-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        generateQuestion();
    }

    function generateQuestion() {
        // Reset element states
        document.getElementById('feedback-text').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('user-answer').value = '';
        
        const randomTriple = TRIPLES[Math.floor(Math.random() * TRIPLES.length)];
        const [a, b, c] = randomTriple;

        if (currentMode === 1) {
            document.getElementById('mode1-input-area').classList.remove('hidden');
            document.getElementById('mode2-input-area').classList.add('hidden');
            
            const missingType = ['a', 'b', 'c'][Math.floor(Math.random() * 3)];
            
            if (missingType === 'a') {
                document.getElementById('question-text').innerHTML = `Given a right triangle with:<br>side <b>b = ${b}</b> and hypotenuse <b>c = ${c}</b>.<br><br>What is side <b>a</b>?`;
                currentCorrectAnswer = a;
            } else if (missingType === 'b') {
                document.getElementById('question-text').innerHTML = `Given a right triangle with:<br>side <b>a = ${a}</b> and hypotenuse <b>c = ${c}</b>.<br><br>What is side <b>b</b>?`;
                currentCorrectAnswer = b;
            } else {
                document.getElementById('question-text').innerHTML = `Given a right triangle with:<br>legs <b>a = ${a}</b> and <b>b = ${b}</b>.<br><br>What is the hypotenuse <b>c</b>?`;
                currentCorrectAnswer = c;
            }
        } 
        else if (currentMode === 2) {
            document.getElementById('mode1-input-area').classList.add('hidden');
            document.getElementById('mode2-input-area').classList.remove('hidden');

            const isRealTriple = Math.random() < 0.5;
            let displaySides = [a, b, c];

            if (!isRealTriple) {
                // Modify one side value slightly so it fails the Pythagorean formula
                const modifyIdx = Math.floor(Math.random() * 3);
                const offset = Math.random() < 0.5 ? 1 : -1;
                displaySides[modifyIdx] += offset;
            }

            // Shuffle display order so the longest side isn't always at the end
            displaySides.sort(() => Math.random() - 0.5);
            currentTripletState = [...displaySides];

            document.getElementById('question-text').innerHTML = `Do these three side lengths form a right triangle?<br><br><span style="font-size: 1.8rem; color: #2563eb;">${displaySides.join(', ')}</span>`;
        }
    }

    // Checking handler for Mode 1 (Integer input)
    function checkAnswer1() {
        const userAnsElement = document.getElementById('user-answer');
        const userAns = parseInt(userAnsElement.value.strip ? userAnsElement.value.strip() : userAnsElement.value);
        
        if (isNaN(userAns)) return;

        const feedback = document.getElementById('feedback-text');
        feedback.classList.remove('hidden');

        if (userAns === currentCorrectAnswer) {
            feedback.className = "feedback correct";
            feedback.innerText = "✅ Correct!";
        } else {
            feedback.className = "feedback incorrect";
            feedback.innerText = `❌ Incorrect. The correct answer was ${currentCorrectAnswer}.`;
        }
        document.getElementById('next-btn').classList.remove('hidden');
    }

    // Checking handler for Mode 2 (Yes/No button)
    function checkAnswer2(userSaysYes) {
        // Calculate true mathematical fact to catch edge cases
        const sorted = [...currentTripletState].sort((x, y) => x - y);
const isRightTriangle = (Math.pow(sorted[0], 2) + Math.pow(sorted[1], 2) === Math.pow(sorted[2], 2));
const feedback = document.getElementById('feedback-text');
feedback.classList.remove('hidden');
if (userSaysYes === isRightTriangle) {
feedback.className = "feedback correct";
feedback.innerText = "✅ Correct!";
} else {
feedback.className = "feedback incorrect";
feedback.innerText = ❌ Incorrect. It is ${isRightTriangle ? 'indeed' : 'NOT'} a right triangle.;
}
document.getElementById('next-btn').classList.remove('hidden');
}
